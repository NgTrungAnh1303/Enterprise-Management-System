spring:
  datasource:
    url: jdbc:postgresql://127.0.0.1:5432/ems_db
    username: postgres
    password: postgres123
  flyway:
    enabled: true
    url: jdbc:postgresql://127.0.0.1:5432/ems_db
    user: postgres
    password: postgres123
    locations: classpath:db/migration,classpath:db/seed-dev
    baseline-on-migrate: true
    create-schemas: true
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

DB_HOST: 127.0.0.1
DB_PORT: 5432
DB_NAME: ems_db
MIGRATION_USER: postgres
MIGRATION_PASSWORD: postgres123

logging:
  level:
    com.fpt.ems.be: DEBUG
    org.springframework.security: DEBUG
    com.fpt.ems.be.config.DatabaseAutoCreator: INFO

