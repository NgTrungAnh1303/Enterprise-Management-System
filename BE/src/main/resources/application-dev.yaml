spring:
  datasource:
    url: jdbc:postgresql://127.0.0.1:5432/ems_db
    username: postgres
    password: postgres123
  flyway:
    enabled: true
    url: jdbc:postgresql://127.0.0.1:5432/ems_db
    user: postgres
    password: postgres123
    locations: classpath:db/migration,classpath:db/seed-dev
    baseline-on-migrate: true
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    com.fpt.ems.be: DEBUG
    org.springframework.security: DEBUG

